---
- name: Configure Ubuntu appearance
  hosts: Ubuntu
  become: true

  tasks:
    - name: Set Ubuntu to light mode
      ansible.builtin.copy:
        dest: /etc/dconf/db/local.d/01-dark-mode
        content: |
          [org/gnome/desktop/interface]
          color-scheme='prefer-light'
        owner: root
        group: root
        mode: '0644'

    - name: Update dconf database
      ansible.builtin.command:
        cmd: dconf update
      changed_when: true
