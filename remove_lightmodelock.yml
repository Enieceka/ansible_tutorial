- name: Unlock Ubuntu appearance settings
  hosts: Ubuntu
  become: true

  tasks:
    - name: Remove light mode configuration
      ansible.builtin.file:
        path: /etc/dconf/db/local.d/00-light-mode
        state: absent

    - name: Remove light mode lock
      ansible.builtin.file:
        path: /etc/dconf/db/local.d/locks/light-mode
        state: absent

    - name: Update dconf database
      ansible.builtin.command: dconf update
      changed_when: true