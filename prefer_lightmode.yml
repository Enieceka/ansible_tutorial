---
- name: Force Ubuntu light mode
  hosts: Ubuntu
  become: true

  tasks:
    - name: Install dconf tools
      ansible.builtin.apt:
        name: dconf-cli
        state: present

    - name: Configure dconf user profile
      ansible.builtin.copy:
        dest: /etc/dconf/profile/user
        content: |
          user-db:user
          system-db:local
        owner: root
        group: root
        mode: '0644'

    - name: Create dconf configuration directory
      ansible.builtin.file:
        path: /etc/dconf/db/local.d
        state: directory
        mode: '0755'

    - name: Force light mode
      ansible.builtin.copy:
        dest: /etc/dconf/db/local.d/00-light-mode
        content: |
          [org/gnome/desktop/interface]
          color-scheme='prefer-light'
          gtk-theme='Yaru'
        owner: root
        group: root
        mode: '0644'

    - name: Lock light mode settings
      ansible.builtin.copy:
        dest: /etc/dconf/db/local.d/locks/light-mode
        content: |
          /org/gnome/desktop/interface/color-scheme
          /org/gnome/desktop/interface/gtk-theme
        owner: root
        group: root
        mode: '0644'

    - name: Update dconf database
      ansible.builtin.command:
        cmd: dconf update
      changed_when: true